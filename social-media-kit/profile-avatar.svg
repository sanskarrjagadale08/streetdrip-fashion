<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1A0A10" />
      <stop offset="60%" stop-color="#0B0B0E" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>

    <!-- Metallic Edge Gradient -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4FF00" />
      <stop offset="40%" stop-color="#EADBCE" />
      <stop offset="100%" stop-color="#4A121A" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" />

  <!-- Outer Geometric Technical Frame -->
  <circle cx="400" cy="400" r="360" fill="none" stroke="url(#edgeGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="400" cy="400" r="348" fill="none" stroke="#EADBCE" stroke-width="1.5" opacity="0.6" />

  <!-- Corner Crosshairs & Coordinates -->
  <g stroke="#D4FF00" stroke-width="2" opacity="0.8">
    <line x1="400" y1="20" x2="400" y2="45" />
    <line x1="400" y1="755" x2="400" y2="780" />
    <line x1="20" y1="400" x2="45" y2="400" />
    <line x1="755" y1="400" x2="780" y2="400" />
  </g>

  <!-- Technical Brand Badges -->
  <text x="400" y="110" font-family="'Courier New', monospace" font-size="16" fill="#D4FF00" text-anchor="middle" letter-spacing="6" font-weight="bold">EST. 2026 // EDITION 01</text>
  <text x="400" y="710" font-family="'Courier New', monospace" font-size="15" fill="#EADBCE" text-anchor="middle" letter-spacing="5" opacity="0.85">STREETWEAR ARCHITECTURE</text>

  <!-- Central Monogram Icon "SD" -->
  <g transform="translate(400, 400)">
    <!-- Decorative Center Hexagon Ring -->
    <polygon points="0,-180 155,-90 155,90 0,180 -155,90 -155,-90" fill="#14060B" stroke="#4A121A" stroke-width="8" opacity="0.9" />
    <polygon points="0,-180 155,-90 155,90 0,180 -155,90 -155,-90" fill="none" stroke="#D4FF00" stroke-width="2" stroke-dasharray="14 10" opacity="0.75" />

    <!-- Stylized "S" -->
    <path d="M -60 -100 L 40 -100 L 40 -60 L -40 -60 L -40 -15 L 50 -15 L 50 85 L -55 85 L -55 45 L 20 45 L 20 15 L -60 15 Z" fill="#EADBCE" />
    
    <!-- Neon Lime Dynamic Drip Slash -->
    <polygon points="35,-115 55,-115 20,115 0,115" fill="#D4FF00" filter="url(#neonGlow)" />

    <!-- Stylized "D" Offset Overlay -->
    <path d="M -20 -80 L 35 -80 C 85 -80 105 -40 105 0 C 105 40 85 80 35 80 L -20 80 L -20 50 L 30 50 C 60 50 72 25 72 0 C 72 -25 60 -50 30 -50 L -20 -50 Z" fill="#D4FF00" opacity="0.95" />
  </g>

  <!-- Main Brand Title Arc / Bottom Banner -->
  <rect x="230" y="525" width="340" height="42" fill="#D4FF00" rx="0" />
  <text x="400" y="553" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" fill="#0B0B0E" text-anchor="middle" letter-spacing="4">STREETDRIP</text>

  <!-- Micro Technical Tags -->
  <text x="400" y="590" font-family="'Courier New', monospace" font-size="12" fill="#EADBCE" text-anchor="middle" letter-spacing="3" opacity="0.7">VERIFIED GLOBAL CATALOG</text>
</svg>
